name: Sync PeerTube

on:
  schedule:
    - cron: '41 */3 * * *'
  workflow_dispatch:
    inputs:
      model:
        description: 'LiteLLM model for the AI summaries (empty: the LLM_MODEL variable)'
        required: false
      compare:
        description: 'Compare only, no sync: LiteLLM models, comma separated (the summaries go to the run summary)'
        required: false

permissions:
  contents: read

concurrency:
  group: sync-peertube

jobs:
  sync:
    runs-on: ubuntu-latest
    # Off until the videos collection and its key exist; see the script header.
    if: vars.PEERTUBE_URL != ''

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Mirror PeerTube's public videos into Typesense
        env:
          PEERTUBE_URL: ${{ vars.PEERTUBE_URL }}
          TYPESENSE_URL: https://typesense.criptonautas.co
          TYPESENSE_VIDEOS_KEY: ${{ secrets.TYPESENSE_VIDEOS_KEY }}
          # Caption chunks: off while VIDEO_CHUNKS is unset.
          VIDEO_CHUNKS: ${{ vars.VIDEO_CHUNKS }}
          # AI summaries: off while LLM_URL is unset.
          LLM_URL: ${{ vars.LLM_URL }}
          LLM_KEY: ${{ secrets.LLM_KEY }}
          LLM_MODEL: ${{ inputs.model || vars.LLM_MODEL }}
          LLM_MAX: ${{ vars.LLM_MAX }}
          # Spanish and English for every video: off while VIDEO_TRANSLATE is unset.
          VIDEO_TRANSLATE: ${{ vars.VIDEO_TRANSLATE }}
          PEERTUBE_USER: ${{ secrets.PEERTUBE_USER }}
          PEERTUBE_PASSWORD: ${{ secrets.PEERTUBE_PASSWORD }}
          COMPARE_MODELS: ${{ inputs.compare }}
        run: python3 .github/scripts/peertube_sync.py
