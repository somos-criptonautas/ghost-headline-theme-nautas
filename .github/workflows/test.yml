name: Test

on:
  pull_request:
  push:
    branches:
      - main
      - 'renovate/*'

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - run: pnpm install --no-frozen-lockfile

      # assets/built/ is committed and Deploy Theme uploads it as-is, with no
      # build step. Rebuild from the lockfile's dependencies and fail when the
      # result differs from what was committed, so a bundle built from stale
      # local node_modules is caught here instead of reaching the live site.
      - run: pnpm exec gulp build

      - name: Committed assets/built matches a fresh build
        run: |
          if ! git diff --quiet -- assets/built; then
            git diff --stat -- assets/built
            echo "::error::assets/built is out of date. Run pnpm install, then pnpm exec gulp build, and commit the result."
            exit 1
          fi

      - run: pnpm zip

      - run: pnpm exec gscan --fatal --verbose .

  required-checks-pass:
    name: Required checks pass
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
