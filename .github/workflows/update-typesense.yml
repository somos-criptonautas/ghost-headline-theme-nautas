name: Update search vendor builds

on:
  # Run weekly on Mondays at 00:00 UTC
  schedule:
    - cron: '0 0 * * 1'
  # Allow manual trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-search-ui:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Both are unmodified vendor builds. Majors are pinned: a major bump
      # is a breaking API change in assets/js/search-modal.js, which should be
      # a reviewed commit rather than a Monday-morning surprise.
      - name: Download InstantSearch.js and the Typesense adapter
        run: |
          curl --fail --silent --show-error --location \
            https://cdn.jsdelivr.net/npm/instantsearch.js@4/dist/instantsearch.production.min.js \
            -o assets/js/instantsearch.min.js
          curl --fail --silent --show-error --location \
            https://cdn.jsdelivr.net/npm/typesense-instantsearch-adapter@2/dist/typesense-instantsearch-adapter.min.js \
            -o assets/js/typesense-instantsearch-adapter.min.js

      # search-modal.js reads these two globals and does nothing without them.
      # Refuse a build that renamed or failed to expose one rather than ship a
      # site whose search silently never opens.
      - name: Check the builds still expose the globals search-modal.js needs
        run: |
          for pair in "instantsearch.min.js:instantsearch" \
                      "typesense-instantsearch-adapter.min.js:TypesenseInstantSearchAdapter"; do
            file="assets/js/${pair%%:*}"
            global="${pair##*:}"
            if [ ! -s "$file" ]; then
              echo "::error::$file is missing or empty"
              exit 1
            fi
            if ! grep -q "$global" "$file"; then
              echo "::error::$file no longer mentions $global - check assets/js/search-modal.js against the new build"
              exit 1
            fi
          done

      # Stage first, then diff the index: git diff alone ignores untracked
      # files, so on the first run - when neither bundle is in the repo yet -
      # it would report "no change" and the workflow would never commit the
      # very files it just downloaded.
      - name: Check for a new version
        id: git-check
        run: |
          git add assets/js/instantsearch.min.js assets/js/typesense-instantsearch-adapter.min.js
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git commit -m "Update InstantSearch and Typesense adapter builds"
          git push

      # A GITHUB_TOKEN push does not trigger Deploy Theme, so ship it here.
      # The action logs "successfully uploaded" for any 2xx, so when /ghost/ sits
      # behind a forward-auth proxy the POST is redirected to a login page and
      # the deploy reports success while Ghost never sees the theme. Fail here
      # instead: unauthenticated Ghost answers 401 JSON, a proxy answers 3xx.
      - name: Preflight - Ghost Admin API must be reachable
        env:
          API_URL: ${{ secrets.GHOST_ADMIN_API_URL }}
        run: |
          url="${API_URL%/}/ghost/api/admin/themes/"
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$url" || echo 000)
          case "$code" in
            30*)
              echo "::error::Admin API redirected (HTTP $code). /ghost/ is behind an auth proxy, so theme uploads silently do nothing. Exempt ^/ghost/api/admin/themes/ from it."
              exit 1
              ;;
            401|403|200)
              echo "Admin API reachable (HTTP $code)."
              ;;
            *)
              echo "::error::Admin API unreachable (HTTP $code)."
              exit 1
              ;;
          esac

      - name: Deploy theme
        if: steps.git-check.outputs.changed == 'true'
        uses: TryGhost/action-deploy-theme@v2
        with:
          api-url: ${{ secrets.GHOST_ADMIN_API_URL }}
          api-key: ${{ secrets.GHOST_ADMIN_API_KEY }}
          version: 'v5.0'
          theme-name: 'ghost-headline-theme-nautas'
          exclude: ".github pnpm-lock.yaml pnpm-workspace.yaml gulpfile.js README.md CLAUDE.md AGENTS.md LICENSE node_modules *.map"
