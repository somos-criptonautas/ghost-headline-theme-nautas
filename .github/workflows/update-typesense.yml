name: Update Typesense Search UI

on:
  # Run weekly on Mondays at 00:00 UTC
  schedule:
    - cron: '0 0 * * 1'
  # Allow manual trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-search-ui:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download latest Typesense Search UI
        run: |
          curl --fail --silent --show-error --location \
            https://unpkg.com/@magicpages/ghost-typesense-search-ui/dist/search.min.js \
            -o assets/js/typesense-search.min.js

      # assets/js/head.js styles the search modal's input by this class from
      # outside its shadow root. Refuse a build that renamed it rather than ship
      # a modal that silently lost that styling.
      - name: Check the build still has the input head.js styles
        run: |
          if ! grep -q 'mp-search-input' assets/js/typesense-search.min.js; then
            echo "::error::typesense-search.min.js no longer contains .mp-search-input - update SEARCH_CSS in assets/js/head.js"
            exit 1
          fi

      - name: Check for a new version
        id: git-check
        run: |
          if git diff --quiet -- assets/js/typesense-search.min.js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add assets/js/typesense-search.min.js
          git commit -m "Update Typesense Search UI to latest version"
          git push

      # A GITHUB_TOKEN push does not trigger Deploy Theme, so ship it here.
      # The action logs "successfully uploaded" for any 2xx, so when /ghost/ sits
      # behind a forward-auth proxy the POST is redirected to a login page and
      # the deploy reports success while Ghost never sees the theme. Fail here
      # instead: unauthenticated Ghost answers 401 JSON, a proxy answers 3xx.
      - name: Preflight - Ghost Admin API must be reachable
        env:
          API_URL: ${{ secrets.GHOST_ADMIN_API_URL }}
        run: |
          url="${API_URL%/}/ghost/api/admin/themes/"
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$url" || echo 000)
          case "$code" in
            30*)
              echo "::error::Admin API redirected (HTTP $code). /ghost/ is behind an auth proxy, so theme uploads silently do nothing. Exempt ^/ghost/api/admin/themes/ from it."
              exit 1
              ;;
            401|403|200)
              echo "Admin API reachable (HTTP $code)."
              ;;
            *)
              echo "::error::Admin API unreachable (HTTP $code)."
              exit 1
              ;;
          esac

      - name: Deploy theme
        if: steps.git-check.outputs.changed == 'true'
        uses: TryGhost/action-deploy-theme@v2
        with:
          api-url: ${{ secrets.GHOST_ADMIN_API_URL }}
          api-key: ${{ secrets.GHOST_ADMIN_API_KEY }}
          version: 'v5.0'
          theme-name: 'ghost-headline-theme-nautas'
          exclude: ".github pnpm-lock.yaml pnpm-workspace.yaml gulpfile.js README.md CLAUDE.md AGENTS.md LICENSE node_modules *.map"
